<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内ナレッジAIチャットボット</title>
<style>
  :root {
    --bg-top: #0f1720;
    --bg-bottom: #1b2735;
    --surface: rgba(255, 255, 255, 0.06);
    --surface-solid: #1b2530;
    --border: rgba(255, 255, 255, 0.09);
    --ink: #e8edf2;
    --muted: #8a97a6;
    --accent-a: #6d8dff;
    --accent-b: #7ee0d6;
    --user-bubble: linear-gradient(135deg, #6d8dff, #7c6dff);
    --error: #ff8080;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(109, 141, 255, 0.25), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(126, 224, 214, 0.15), transparent 55%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
  }

  .page {
    max-width: 1040px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 24px 24px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 4px 22px;
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 8px 20px rgba(109, 141, 255, 0.35);
    flex-shrink: 0;
  }

  header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 15px;
    color: var(--muted);
  }

  #toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
  }

  .dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-b);
    box-shadow: 0 0 8px var(--accent-b);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #shell {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 460px;
    max-height: 78vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  #log {
    flex: 1;
    min-height: 0;
    padding: 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
  }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 8px; }

  .greeting {
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    padding: 14px 0 2px;
  }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
  }

  .row.bot .avatar { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
  .row.error .avatar { background: rgba(255, 128, 128, 0.15); }

  .bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 17px;
    line-height: 1.7;
    word-break: break-word;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 700; }

  .row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 8px 20px rgba(109, 141, 255, 0.25);
  }

  .row.bot .bubble {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .row.error .bubble {
    background: rgba(255, 128, 128, 0.08);
    border: 1px solid rgba(255, 128, 128, 0.3);
    color: var(--error);
    border-bottom-left-radius: 4px;
  }

  .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }

  .row.bot:has(.mermaid) .bubble { max-width: 92%; }

  .mermaid {
    margin-top: 10px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    overflow-x: auto;
  }

  .typing .bubble { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
  .typing .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form {
    display: flex;
    gap: 12px;
    padding: 18px;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
  }

  input {
    flex: 1;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    border-radius: 999px;
    padding: 15px 22px;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent-a); background: rgba(255, 255, 255, 0.07); }

  button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #0f1720;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 8px 20px rgba(109, 141, 255, 0.3);
    transition: transform 0.12s ease, opacity 0.15s ease;
  }

  button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  button:not(:disabled):hover { transform: scale(1.06); }
  button:not(:disabled):active { transform: scale(0.96); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 16px 4px 2px;
  }

  @media (max-width: 480px) {
    .page { padding: 18px 10px 14px; }
    header h1 { font-size: 19px; }
    .bubble { max-width: 85%; font-size: 16px; }
  }

</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">🧠</div>
    <div>
      <h1>社内ナレッジAIチャットボット</h1>
      <p>標準旅行業約款・OTAガイドラインなど旅行業関連の規定や、旅行業務取扱管理者試験の過去問に関する質問にお答えします。社内規定についても聞いてください</p>
    </div>
    <div id="toggle"><span class="dot-live"></span>Knowledge Base 接続中</div>
  </header>

  <main>
    <div id="shell">
      <div id="log">
        <p class="greeting">こんにちは。社内規定について、何でもお気軽にどうぞ。</p>
      </div>
      <form id="form">
        <input id="question" placeholder="質問を入力..." autocomplete="off">
        <button type="submit" aria-label="送信">➤</button>
      </form>
    </div>
    <footer>Amazon Bedrock Knowledge Base（S3 Vectors）搭載</footer>
  </main>
</div>
<script type="module">
  // CDN読み込み失敗時にチャット全体が止まらないよう、静的importではなく
  // 動的importで読み込み、失敗時はダイアグラム機能だけを諦める
  let mermaid = null;
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    mermaid = mod.default;
    mermaid.initialize({ startOnLoad: false, theme: "default" });
  } catch (e) {
    console.warn("mermaid.js の読み込みに失敗しました。フローチャートはコードのまま表示されます。", e);
  }

  const API_ENDPOINT = "__API_ENDPOINT__";
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const button = form.querySelector("button");
  let sessionId = null;

  function icon(role) {
    if (role === "user") return "🧑";
    if (role === "error") return "⚠️";
    return "🤖";
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inlineFormat(s) {
    return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  // **太字**・番号付き/箇条書きリストだけに対応した簡易Markdownレンダラー。
  // 外部ライブラリを使わず、先にHTMLエスケープしてから自前タグのみ挿入するため安全。
  function renderMarkdownLite(text) {
    let html = "";
    let listType = null;
    const closeList = () => {
      if (listType) {
        html += `</${listType}>`;
        listType = null;
      }
    };

    for (const rawLine of escapeHtml(text).split("\n")) {
      const line = rawLine.trim();
      const ol = line.match(/^\d+\.\s+(.*)/);
      const ul = line.match(/^[-・]\s+(.*)/);
      if (ol) {
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += `<li>${inlineFormat(ol[1])}</li>`;
      } else if (ul) {
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += `<li>${inlineFormat(ul[1])}</li>`;
      } else if (line === "") {
        closeList();
      } else {
        closeList();
        html += `<p>${inlineFormat(line)}</p>`;
      }
    }
    closeList();
    return html;
  }

  function addBubble(role, text, sources) {
    const row = document.createElement("div");
    row.className = "row " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = icon(role);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // 回答内の ```mermaid ...``` ブロックを検出し、図として描画する
    const mermaidNodes = [];
    const segments = text.split(/```mermaid\n?([\s\S]*?)```/g);
    segments.forEach((segment, i) => {
      if (i % 2 === 1) {
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = segment.trim();
        bubble.appendChild(diagram);
        mermaidNodes.push(diagram);
      } else if (segment.trim()) {
        const textBlock = document.createElement("div");
        textBlock.innerHTML = renderMarkdownLite(segment.trim());
        bubble.appendChild(textBlock);
      }
    });

    if (sources && sources.length) {
      const src = document.createElement("div");
      src.className = "sources";
      src.textContent = "📄 出典: " + sources.join(" / ");
      bubble.appendChild(src);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;

    if (mermaidNodes.length && mermaid) {
      mermaid.run({ nodes: mermaidNodes }).catch(() => {});
    }

    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot typing";
    row.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  async function ask(question) {
    if (!question || button.disabled) return;
    addBubble("user", question);
    input.value = "";
    button.disabled = true;
    const typing = addTyping();

    try {
      const res = await fetch(API_ENDPOINT + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, sessionId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      sessionId = data.sessionId || sessionId;
      typing.remove();
      addBubble("bot", data.answer, data.sources);
    } catch (err) {
      typing.remove();
      addBubble("error", "エラー: " + err.message);
    } finally {
      button.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    ask(input.value.trim());
  });
</script>
</body>
</html>
